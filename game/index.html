<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHTVAULT — a top-down stealth heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c12; }
  /* Keep the 16:9 canvas un-squashed on any viewport: letterbox, never stretch. */
  #game { position: fixed; inset: 0; margin: auto; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="NIGHTVAULT: a top-down stealth game. Steal the relic on each floor and reach the exit unseen, past guards with vision cones."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
